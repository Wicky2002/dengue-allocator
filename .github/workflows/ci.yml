name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # geo pulls in shapely/geopandas, needed by test_boundaries.py. It's kept
        # optional in pyproject.toml so `make setup` stays lightweight on a bare
        # machine, but CI should still exercise that code path.
        run: python -m pip install --upgrade pip && pip install -e ".[dev,geo]"

      - name: Lint
        run: |
          ruff check src tests app
          ruff format --check src tests app

      - name: Test
        run: pytest -m "not network and not slow"

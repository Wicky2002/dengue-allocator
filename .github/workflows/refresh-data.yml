name: Refresh real data

# Automates the exact manual refresh step documented in .gitignore's
# "DELIBERATE EXCEPTION" comment: `make data && make panel &&
# make pipeline-real && make history-real`, then re-commit the 15
# whitelisted dashboard artifacts. Streamlit Community Cloud auto-redeploys
# on the resulting push, so the hosted demo picks up fresh figures with no
# manual step.
#
# This refreshes DATA, not MODELS. Stage 1's LightGBM hyperparameters and
# ensemble weights come from the already-tuned data/processed/tuned_hyperparams.json
# (see `make tune`, a separate ~30-minute search run only occasionally by
# hand) -- this workflow never re-runs that search. What it does is cheap:
# the full pipeline ran in ~150s against real data the last time it was
# timed by hand.

on:
  schedule:
    # 03:00 UTC daily -- after most WER issues are published, well clear of
    # any deploy/demo activity elsewhere.
    - cron: "0 3 * * *"
  workflow_dispatch: {}  # manual "Run workflow" button in the Actions tab

concurrency:
  group: refresh-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        # Every step below drives the Makefile (`make data`, `make panel`, ...),
        # and every target there runs through $(PY) = .venv/bin/python -- unlike
        # CI's own job, which only calls bare `pytest`/`ruff` and can install
        # straight into the runner's system Python. Skipping the venv here (as
        # this step used to, copied from ci.yml) leaves .venv/bin/python missing,
        # so every `make` target fails with "command not found" (exit 127) --
        # silently for `make data`, whose lines are each prefixed with `-` to
        # tolerate an individual source being down, and fatally at `make panel`,
        # the first unprefixed target.
        #
        # geo extra: dengue.ingest.boundaries (part of `make data`) needs
        # shapely/geopandas, same as CI's own test job.
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev,geo]"

      - name: Ingest real sources
        # Each ingest step in `make data` is prefixed with `-` in the
        # Makefile, so one source failing (e.g. ReliefWeb 403 without an
        # approved appname, or epid.gov.lk being briefly unreachable) does
        # not fail this step -- the pipeline proceeds on whatever sources
        # succeeded, exactly as it does when run by hand.
        env:
          RELIEFWEB_APPNAME: ${{ secrets.RELIEFWEB_APPNAME }}
        run: make data

      - name: Build the real panel
        run: make panel

      - name: Run the full pipeline against real data
        run: make pipeline-real

      - name: Send due email alerts
        # Reads district_risk.parquet, just written above, against every
        # public.alert_subscriptions row (dengue.platform.alerts). Degrades
        # to a no-op with a logged warning -- not a failed run -- if the
        # Supabase/Resend secrets below aren't set yet; see alerts.py's
        # module docstring for what each one is for.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_FROM_EMAIL: ${{ secrets.ALERT_FROM_EMAIL }}
        run: make alerts

      - name: Refresh the predicted-vs-actual historical view
        # Bounded to a fixed 2026 Jun-Aug window (dengue.eval.history) -- as
        # real weeks inside that window keep arriving, this fills in the
        # origins that couldn't be scored yet because their target week
        # hadn't happened. Once the window is fully in the past this becomes
        # a no-op re-run of the same result.
        run: make history-real

      - name: Commit refreshed artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # A shell-expanded glob (artifacts/*.parquet) would include
          # predictions.parquet -- gitignored on purpose (read by no page,
          # see .gitignore's comment) -- and `git add` errors on an
          # explicitly-named ignored path. Adding the directory itself
          # instead lets git's own ignore rules apply silently.
          git add artifacts/
          if git diff --cached --quiet; then
            echo "No artifact changes -- nothing to commit."
          else
            git commit -m "Scheduled data refresh: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dengue-allocator"
version = "0.1.0"
description = "Forecast -> causal effect -> allocation pipeline for dengue vector control in Sri Lanka"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "dengue-allocator contributors" }]

dependencies = [
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pyarrow==16.1.0",
    "scipy>=1.11,<2",
    "scikit-learn==1.5.0",
    "lightgbm==4.3.0",
    "statsmodels==0.14.2",
    "httpx==0.27.0",
    "pdfplumber==0.11.0",
    "networkx==3.3",
    "pulp==2.8.0",
    # streamlit 1.35.0 shipped a frontend build with two rendering bugs this
    # project hit directly: (1) inline non-tabular data (this app's district
    # GeoJSON) silently lost its geometry through Streamlit's Arrow
    # serialisation -- the chart compiled, the legend drew, nothing else did,
    # no error anywhere; (2) any `st.dataframe(..., column_config=...)` threw
    # an uncaught frontend TypeError that blanked the whole page. Both are
    # gone as of 1.61.1. Pinned explicitly rather than left open specifically
    # because "just take whatever's newest" is exactly how the app ended up
    # on a broken frontend/spec-version pairing the first time.
    "streamlit==1.61.1",
    # Never pin loosely again: altair was previously an UNPINNED transitive
    # dependency of streamlit, which let pip resolve it to whatever the
    # newest release happened to be (5.5.0) independent of what Streamlit's
    # bundled frontend actually understood -- the other half of bug (1)
    # above. Pinned to the version verified working against streamlit 1.61.1.
    "altair==5.3.0",
    "python-dotenv==1.0.1",
    "tabulate==0.9.0",
]

[project.optional-dependencies]
# Heavier / platform-sensitive extras. `make setup` installs the core set only;
# `make setup-full` adds these. Keeping them optional is what lets the acceptance
# criterion (`make baseline`, offline) hold on a bare machine.
geo = [
    "geopandas==0.14.4",
    "shapely==2.0.4",
]
fast = [
    "polars==0.20.31",
]
dev = [
    "pytest==8.2.1",
    "pytest-cov==5.0.0",
    "ruff==0.4.7",
    # Renders a Vega-Lite spec to PNG with no browser/Node/Chromium required
    # (self-contained Rust binary wheel). This exists specifically so chart
    # code can be regression-tested end to end -- a spec that *builds*
    # without a Python exception can still fail to *render* (e.g. a raw "."
    # in a field name is valid Python but invalid Vega-Lite), and that gap is
    # exactly how the choropleth field-name bug shipped undetected.
    "vl-convert-python==1.6.0",
]

[project.urls]
Homepage = "https://github.com/OWNER/dengue-allocator"

[tool.hatch.build.targets.wheel]
packages = ["src/dengue"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
ignore = [
    "B008",    # function call in default arg - used deliberately for Path defaults
    "RUF012",  # mutable class attrs need ClassVar - noisy for simple model configs
    # Typographic characters (en dash, minus sign, Greek rho) and emoji are
    # deliberate in dashboard copy and docstrings. Flagging them as "ambiguous"
    # would push the UI toward ASCII-only text, which reads worse.
    "RUF001",
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# Streamlit apps are top-to-bottom scripts: module-level statements after the
# sys.path shim are the intended structure, not a lint violation.
"app/*" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["dengue"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::FutureWarning",
    "ignore::DeprecationWarning",
]
markers = [
    "network: test requires outbound network access (deselected by default in `make test`)",
    "slow: long-running test",
]
